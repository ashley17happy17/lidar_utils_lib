version: '3.8'

services:
  pc_dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: lidar_utils_lib:noetic
    container_name: lidar_utils_lib
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      # 告訴容器我們需要圖形與運算能力
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - ./src:/root/catkin_ws/src:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - "$HOME/.Xauthority:/root/.Xauthority:rw"
      - ${HDMAP_PATH:-/tmp}:/root/catkin_ws/hdmap_regenerate
      - ${DATA_PATH:-/tmp}:/root/catkin_ws/data

    stdin_open: true
    tty: true
    # 這是現代 Docker Compose 呼叫 GPU 的標準寫法
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu, utility, compute, graphics, display ]
